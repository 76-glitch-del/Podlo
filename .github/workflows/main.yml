name: Construire Podlo
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Ranger les fichiers
        run: |
          mkdir -p www assets
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png apple-touch-icon.png www/
          cp icon-only.png icon-foreground.png icon-background.png splash.png assets/
          cp splash-dark.png assets/ || true
      - run: npm install
      - run: npx cap add android
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Podlo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
